<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Reset Invoice password</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 32px; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: #1f2937; background: #fff; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; color: #5851d8; }
    p { margin: 0 0 16px; color: #4b5563; }
    .account { margin-bottom: 20px; padding: 12px 14px; border: 1px solid #e5e7eb; border-radius: 6px; background: #f9fafb; }
    .account strong { display: block; }
    label { display: block; margin-bottom: 4px; font-weight: 500; }
    input { width: 100%; margin-bottom: 14px; padding: 8px 10px; font: inherit; border: 1px solid #d1d5db; border-radius: 6px; }
    input:focus { outline: 2px solid #5851d8; outline-offset: -1px; border-color: #5851d8; }
    .error { min-height: 1.5em; margin-bottom: 12px; color: #b91c1c; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; }
    button { padding: 8px 16px; font: inherit; border-radius: 6px; cursor: pointer; border: 1px solid #d1d5db; background: #fff; }
    button.primary { border-color: #5851d8; background: #5851d8; color: #fff; }
    button:disabled { opacity: 0.6; cursor: default; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Reset your Invoice password</h1>

  <div id="loading"><p>Loading…</p></div>

  <div id="unavailable" hidden>
    <p id="unavailable-message"></p>
    <div class="actions"><button class="primary" data-close>Close</button></div>
  </div>

  <form id="form" hidden>
    <p>Choose a new password for the account below. Anyone who can use this Windows account can reset it, so keep Windows protected with a password.</p>
    <div class="account"><strong id="name"></strong><span id="email"></span></div>

    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>

    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>

    <div class="error" id="error" role="alert"></div>
    <div class="actions">
      <button type="button" data-close>Cancel</button>
      <button type="submit" class="primary" id="submit">Set password</button>
    </div>
  </form>

  <div id="done" hidden>
    <p>Your password has been changed. Sign in as <strong id="done-email"></strong> with your new password.</p>
    <div class="actions"><button class="primary" data-close>Close</button></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)
    const show = (id) => ['loading', 'unavailable', 'form', 'done'].forEach((v) => ($(v).hidden = v !== id))

    document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => window.passwordReset.close()))

    window.passwordReset.getAccount().then((account) => {
      if (!account.ok) {
        $('unavailable-message').textContent = account.error
        show('unavailable')
        return
      }
      $('name').textContent = account.name
      $('email').textContent = account.email
      show('form')
      $('password').focus()
    })

    $('form').addEventListener('submit', async (event) => {
      event.preventDefault()
      const password = $('password').value
      $('error').textContent = ''

      if (password.length < 8) {
        $('error').textContent = 'The password must be at least 8 characters.'
        return
      }
      if (password !== $('confirm').value) {
        $('error').textContent = 'The passwords do not match.'
        return
      }

      $('submit').disabled = true
      const result = await window.passwordReset.submit(password)
      $('submit').disabled = false

      if (!result.ok) {
        $('error').textContent = result.error || 'The password could not be changed.'
        return
      }
      $('done-email').textContent = result.email
      show('done')
    })
  </script>
</body>
</html>
