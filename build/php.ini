; php.ini for the bundled desktop PHP (copied into build/php by scripts/fetch-php.mjs).
; The app only listens on 127.0.0.1 and is single-user; settings favour a quiet, local runtime.
;
; extension_dir is not set here: Windows resolves a relative path against the working
; directory, so the desktop launcher passes an absolute -d extension_dir=... instead.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
max_execution_time = 120
max_input_time = 60
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
; error_log is passed by the launcher so it lands in the user's data directory.
post_max_size = 64M
upload_max_filesize = 50M
max_file_uploads = 20
file_uploads = On
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60
variables_order = "GPCS"
request_order = "GP"
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Built into the Windows build: bcmath, ctype, dom, filter, hash, iconv, json, libxml, PDO,
; Phar, session, SimpleXML, SPL, tokenizer, xml, xmlreader, xmlwriter, zip, zlib.
extension = curl
extension = exif
extension = fileinfo
extension = gd
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sodium
extension = sqlite3

zend_extension = opcache

[Date]
date.timezone = UTC

[Session]
session.use_strict_mode = 1

[opcache]
; php -S is one long-lived process, so the opcode cache persists across requests.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Installed code only changes with a new installer, so skip per-request timestamp checks.
opcache.validate_timestamps = 0
