<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode - Invoice Application</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }
    .icon-container {
      width: 64px;
      height: 64px;
      background: #eff6ff;
      color: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
    }
    .icon-container svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #1e293b;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1.5rem;
      background-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background-color 0.2s ease;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #2563eb;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.75rem;
      background-color: #fef3c7;
      color: #92400e;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #f59e0b;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      Offline Mode Active
    </div>
    <div class="icon-container">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m-12.728 0a9 9 0 010-12.728m1.414 1.414a7 7 0 019.9 0m-9.9 0a7 7 0 010 9.9m1.414-1.414a5 5 0 017.07 0m-7.07 0a5 5 0 010-7.07m2.121 2.121a1 1 0 011.414 0m-1.414 0a1 1 0 010 1.414"></path>
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
      <a href="/admin/dashboard" class="btn">Proceed to App (Offline Mode)</a>
      <button class="btn" style="background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1;" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </div>
</body>
</html>
